info:
  description: API de PsyMate, suivi clinique pour psychologues, psychiatres et coachs.
  title: PsyMate API
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/admin/verifications:
    get:
      operationId: listAdminVerifications
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueueDto'
          description: OK
      summary: File des dossiers à vérifier (under_review ou needs_more), pagination par curseur
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}:
    get:
      operationId: getAdminVerification
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DossierDto'
          description: OK
      summary: 'Dossier d''un praticien : identité, coordonnées, justificatifs, décisions'
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/decision:
    post:
      operationId: decideAdminVerification
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DecisionDto'
          description: OK
      summary: Approuve, demande un complément ou refuse (décision append-only)
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}:
    patch:
      operationId: reviewAdminDocument
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentDto'
          description: OK
      summary: Qualifie un justificatif (pending, conform, non_conform)
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}/file:
    get:
      operationId: getAdminDocumentFile
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: exp
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                format: byte
                type: string
          description: OK
      summary: Sert le justificatif déchiffré (URL signée) et consigne l'accès
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}/url:
