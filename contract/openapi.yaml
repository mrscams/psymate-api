components:
  schemas:
    CreateEmotionRequest:
      properties:
        family:
          type: string
        labelFr:
          type: string
      type: object
    CreatePatientRequest:
      properties:
        birthDate:
          format: date
          type: string
        context:
          additionalProperties: {}
          type: object
        displayName:
          type: string
        email:
          type: string
        firstName:
          type: string
        flags:
          items:
            $ref: '#/components/schemas/FlagRequest'
          type: array
        followUp:
          additionalProperties: {}
          type: object
        lastName:
          type: string
        phone:
          type: string
        pronoun:
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    EmotionView:
      properties:
        active:
          type: boolean
        code:
          type: string
        family:
          type: string
        intensityLevel:
          format: int32
          type: integer
        labelEn:
          type: string
        labelFr:
          type: string
        scope:
          type: string
      type: object
    EntryTypeView:
      properties:
        code:
          type: string
        detailTable:
          type: string
        hasDuration:
          type: boolean
        labelEn:
          type: string
        labelFr:
          type: string
        sortOrder:
          format: int32
          type: integer
      type: object
    FlagDto:
      properties:
        kind:
          type: string
        reason:
          type: string
        setAt:
          format: date-time
          type: string
      type: object
    FlagRequest:
      properties:
        kind:
          type: string
        reason:
          type: string
      type: object
    LinkTypeView:
      properties:
        allowedSourceTypes:
          items:
            type: string
          type: array
        allowedTargetTypes:
          items:
            type: string
          type: array
        code:
          type: string
        directed:
          type: boolean
        inverseLabelEn:
          type: string
        inverseLabelFr:
          type: string
        labelEn:
          type: string
        labelFr:
          type: string
        lineStyle:
          type: string
        sortOrder:
          format: int32
          type: integer
      type: object
    LoginRequest:
      properties:
        email:
          maxLength: 254
          minLength: 0
          type: string
        password:
          maxLength: 200
          minLength: 0
          type: string
        rememberMe:
          type: boolean
      required:
      - email
      - password
      type: object
    MeResponse:
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        profession:
          type: string
        tenantId:
          format: uuid
          type: string
        verificationStatus:
          type: string
      type: object
    MergeEmotionRequest:
      properties:
        targetCode:
          type: string
      type: object
    MergeTagRequest:
      properties:
        targetId:
          format: uuid
          type: string
      type: object
    MergeView:
      properties:
        affectedCount:
          format: int32
          type: integer
        id:
          format: uuid
          type: string
        mergedAt:
          format: date-time
          type: string
        sourceCode:
          type: string
        targetCode:
          type: string
        undoUntil:
          format: date-time
          type: string
        undoneAt:
          format: date-time
          type: string
      type: object
    PasswordResetConfirmRequest:
      properties:
        password:
          maxLength: 200
          minLength: 0
          type: string
        token:
          maxLength: 200
          minLength: 0
          type: string
      required:
      - password
      - token
      type: object
    PasswordResetRequest:
      properties:
        email:
          format: email
          maxLength: 254
          minLength: 0
          type: string
      required:
      - email
      type: object
    PatientDto:
      properties:
        archivedAt:
          format: date-time
          type: string
        birthDate:
          format: date
          type: string
        context:
          additionalProperties: {}
          type: object
        createdAt:
          format: date-time
          type: string
        currentVersion:
          format: int32
          type: integer
        displayName:
          type: string
        email:
          type: string
        firstName:
          type: string
        flags:
          items:
            $ref: '#/components/schemas/FlagDto'
          type: array
        followUp:
          additionalProperties: {}
          type: object
        id:
          format: uuid
          type: string
        lastName:
          type: string
        phone:
          type: string
        pronoun:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/TagDto'
          type: array
        updatedAt:
          format: date-time
          type: string
      type: object
    PatientPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PatientDto'
          type: array
        nextCursor:
          type: string
      type: object
    RenameEmotionRequest:
      properties:
        labelFr:
          type: string
      type: object
    SignupRequest:
      properties:
        email:
          format: email
          maxLength: 254
          minLength: 0
          type: string
        firstName:
          maxLength: 100
          minLength: 0
          type: string
        lastName:
          maxLength: 100
          minLength: 0
          type: string
        password:
          maxLength: 200
          minLength: 0
          type: string
        profession:
          minLength: 1
          pattern: psychologist|psychiatrist|coach
          type: string
      required:
      - email
      - firstName
      - lastName
      - password
      - profession
      type: object
    SignupResponse:
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        verificationStatus:
          type: string
      type: object
    TagDto:
      properties:
        id:
          format: uuid
          type: string
        label:
          type: string
      type: object
    TagRequest:
      properties:
        label:
          type: string
      type: object
    TagView:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        normalizedLabel:
          type: string
        usageCount:
          format: int32
          type: integer
      type: object
    TagsRequest:
      properties:
        tags:
          items:
            type: string
          type: array
      type: object
    VersionDto:
      properties:
        authorId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        reason:
          type: string
        snapshot:
          additionalProperties: {}
          type: object
        version:
          format: int32
          type: integer
      type: object
info:
  description: API de PsyMate, suivi clinique pour psychologues, psychiatres et coachs.
  title: PsyMate API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/me:
    get:
      operationId: me
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
      tags:
      - auth-controller
  /api/auth/password-reset/confirm:
    post:
      operationId: confirmReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/password-reset/request:
    post:
      operationId: requestReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/signup:
    post:
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: OK
      tags:
      - auth-controller
  /api/me/emotions:
    post:
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmotionRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EmotionView'
          description: Created
      tags:
      - my-emotion-controller
  /api/me/emotions/merges/{id}/undo:
    post:
      operationId: undo
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MergeView'
          description: OK
      tags:
      - my-emotion-controller
  /api/me/emotions/{code}:
    patch:
      operationId: rename_1
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameEmotionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EmotionView'
          description: OK
      tags:
      - my-emotion-controller
  /api/me/emotions/{code}/merge:
    post:
      operationId: merge_1
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeEmotionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MergeView'
          description: OK
      tags:
      - my-emotion-controller
  /api/patients:
    get:
      operationId: list_1
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: tag
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientPage'
          description: OK
      tags:
      - patient-controller
    post:
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: Created
      tags:
      - patient-controller
  /api/patients/{id}:
    delete:
      operationId: archive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: No Content
      tags:
      - patient-controller
    get:
      operationId: get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: OK
      tags:
      - patient-controller
    patch:
      operationId: patch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
              type: object
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: OK
      tags:
      - patient-controller
  /api/patients/{id}/flags:
    post:
      operationId: addFlag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: Created
      tags:
      - patient-controller
  /api/patients/{id}/flags/{kind}:
    delete:
      operationId: clearFlag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: OK
      tags:
      - patient-controller
  /api/patients/{id}/restore:
    post:
      operationId: restore
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: OK
      tags:
      - patient-controller
  /api/patients/{id}/tags:
    put:
      operationId: replaceTags
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: OK
      tags:
      - patient-controller
  /api/patients/{id}/versions:
    get:
      operationId: versions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/VersionDto'
                type: array
          description: OK
      tags:
      - patient-controller
  /api/tags:
    get:
      operationId: list
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/TagView'
                type: array
          description: OK
      tags:
      - tag-controller
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagView'
          description: Created
      tags:
      - tag-controller
  /api/tags/{id}:
    patch:
      operationId: rename
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagView'
          description: OK
      tags:
      - tag-controller
  /api/tags/{id}/merge:
    post:
      operationId: merge
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeTagRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagView'
          description: OK
      tags:
      - tag-controller
  /api/vocabulary/emotions:
    get:
      operationId: emotions
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/EmotionView'
                type: array
          description: OK
      tags:
      - vocabulary-controller
  /api/vocabulary/entry-types:
    get:
      operationId: entryTypes
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/EntryTypeView'
                type: array
          description: OK
      tags:
      - vocabulary-controller
  /api/vocabulary/link-types:
    get:
      operationId: linkTypes
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/LinkTypeView'
                type: array
          description: OK
      tags:
      - vocabulary-controller
servers:
- description: Serveur courant
  url: /
