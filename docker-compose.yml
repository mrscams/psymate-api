services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: psymate
      POSTGRES_USER: psymate
      POSTGRES_PASSWORD: psymate
    ports:
      - "5432:5432"
    volumes:
      - psymate-db:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à l'initialisation d'un volume vierge (rôle psymate_app, G Q9).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psymate -d psymate"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  psymate-db:
