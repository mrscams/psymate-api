spring:
  application:
    name: psymate-api
  # In dev, Spring Boot starts compose.yaml (Postgres) automatically and wires the datasource.
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

psymate:
  cors:
    allowed-origins: http://localhost:4200
