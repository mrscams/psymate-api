spring:
  application:
    name: psymate-api
  profiles:
    default: local
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    jdbc:
      initialize-schema: never
    timeout: 12h
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  name: PsyMate
  # app.directory.storage-dir : dossier des photos de profil (obligatoire, sans valeur par defaut).
  # Defini ici uniquement pour les profils local et test (tmpdir) ; en production, a fournir par
  # l environnement (APP_DIRECTORY_STORAGE_DIR) tant qu aucun stockage objet n existe.
  # Base des liens envoyes par e-mail (frontend), a surcharger par environnement.
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  contract:
    # Version du contrat OpenAPI publie ; a bumper avant de poser un tag contract-vX.Y.Z.
    version: 0.1.0
  auth:
    session-default: 12h
    session-remember-me: 30d

versioning:
  grace-period: 75m

springdoc:
  api-docs:
    path: /v3/api-docs
  # Cles triees : diff stable du contrat commite.
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/psymate
    username: psymate
    password: psymate

app:
  mail:
    from: test@gmail.com
  directory:
    storage-dir: ${java.io.tmpdir}/psymate-assets

---
# Profil test : la base vient de Testcontainers (@ServiceConnection).
spring:
  config:
    activate:
      on-profile: test

app:
  mail:
    from: test@gmail.com
  directory:
    storage-dir: ${java.io.tmpdir}/psymate-assets

management:
  health:
    mail:
      # Pas de SMTP dans les tests qui ne demarrent pas Mailpit.
      enabled: false
