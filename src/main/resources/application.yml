spring:
  application:
    name: psymate-api
  profiles:
    default: local
  modulith:
    events:
      # Laisse a false : le rejeu au demarrage est fait par EventRepublisher (app.events.*), avec un
      # filtre d age ; la propriete officielle rejoue tout, sans filtre, pendant le refresh du contexte.
      republish-outstanding-events-on-restart: false
      jdbc:
        schema-initialization:
          enabled: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  session:
    jdbc:
      initialize-schema: never
    timeout: 12h
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  name: PsyMate
  # app.directory.storage-dir : dossier des photos de profil (obligatoire, sans valeur par defaut).
  # Defini ici uniquement pour les profils local et test (tmpdir) ; en production, a fournir par
  # l environnement (APP_DIRECTORY_STORAGE_DIR) tant qu aucun stockage objet n existe.
  # Base des liens envoyes par e-mail (frontend), a surcharger par environnement.
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  contract:
    # Version du contrat OpenAPI publie ; a bumper avant de poser un tag contract-vX.Y.Z.
    version: 0.4.0
  # Limitation de debit (G Q24, Bucket4j, shared.ratelimit). Une regle = un motif de chemin (decode),
  # des methodes optionnelles (toutes si absent), la cle de comptage (ip : IPv6 regroupee en /64 ;
  # session : id de session HTTP, les requetes sans session ne sont pas comptees), un nombre de
  # requetes et la periode de rechargement. Valeurs de la decision Q24 : ne pas les changer ici.
  rate-limits:
    rules:
      public-directory:
        pattern: /api/public/**
        key: ip
        limit: 60
        period: 1m
      public-contact:
        pattern: /api/public/directory/practitioners/*/contact
        methods: POST
        key: ip
        limit: 5
        period: 1h
      session:
        pattern: /api/**
        key: session
        limit: 600
        period: 1m
  auth:
    session-default: 12h
    session-remember-me: 30d
  events:
    republish-on-startup: true
    republish-older-than: 30s
    completed-retention: 30d

versioning:
  grace-period: 75m

springdoc:
  api-docs:
    path: /v3/api-docs
  # Cles triees : diff stable du contrat commite.
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/psymate
    username: psymate
    password: psymate

app:
  mail:
    from: test@gmail.com
  directory:
    storage-dir: ${java.io.tmpdir}/psymate-assets
  storage:
    dir: ${java.io.tmpdir}/psymate-storage
  crypto:
    # DEV ONLY : cle AES-256 de developpement (32 octets en base64), sans valeur hors du poste local.
    key: ${APP_CRYPTO_KEY:ZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldC0wMDAwMDA=}

---
# Profil test : la base vient de Testcontainers (@ServiceConnection).
spring:
  config:
    activate:
      on-profile: test

app:
  events:
    # Le rejeu automatique au demarrage ne touche jamais aux lignes que les tests comptent.
    republish-older-than: 1h
  mail:
    from: test@gmail.com
  directory:
    storage-dir: ${java.io.tmpdir}/psymate-assets
  storage:
    dir: ${java.io.tmpdir}/psymate-storage
  crypto:
    # Valeur de test evidente, jamais utilisee hors des tests.
    key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy0wMTIzNDU2Nzg=

management:
  health:
    mail:
      # Pas de SMTP dans les tests qui ne demarrent pas Mailpit.
      enabled: false

---
# Profil cli (M7-08) : commande ponctuelle `--create-admin=<e-mail>` (make admin). Pas de serveur web,
# pas de banniere, journaux reduits a WARN pour que seul le bloc du runner soit lisible, et aucun
# rejeu d evenements au demarrage (la commande n a pas d autre effet que la creation du compte).
spring:
  config:
    activate:
      on-profile: cli
  main:
    web-application-type: none
    banner-mode: "off"
logging:
  level:
    root: WARN
app:
  events:
    republish-on-startup: false
