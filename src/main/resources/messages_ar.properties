# Messages en arabe (M16-04, G Q99). Arabe standard moderne, UTF-8 comme messages_fr et messages_en.
# Toutes les clés de messages_fr.properties, sauf overview.narrative.* et clinical.export.*, qui restent
# en français (G Q102, second temps M16-30 et M16-31) ; MessagesParityTest le vérifie.
# Registre : aucun impératif, aucun accord de genre pour le praticien ni pour la personne suivie
# (nom verbal, tournure impersonnelle ou passive, « يُرجى ») ; PsyMate, codes, champs, adresses et
# valeurs techniques en caractères latins. Aucune apostrophe : le même texte peut être lu avec ou
# sans MessageFormat. Pluriel : un nombre variable ({n}) suit toujours une étiquette (« عدد … : {n} »,
# « المدّة (بالدقائق): {n} ») pour éviter l'accord en nombre ; un nombre écrit dans le texte est accordé.
