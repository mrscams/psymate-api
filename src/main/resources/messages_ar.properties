booking.mail.followUp.refused.body=مرحبًا،\n\nتعذّر قبول طلب الموعد مع {0}:\n\n{1}\n\nلم تُحجز هذه الفترة الزمنية لك. يمكن تقديم طلب جديد لفترة زمنية أخرى من صفحة حجز المواعيد لدى الممارس.\n\n{2} ليس خدمة طوارئ.\n
booking.mail.followUp.cancelled.subject=تم إلغاء الموعد
booking.mail.followUp.cancelled.body=مرحبًا،\n\nتم إلغاء الموعد مع {0}:\n\n{1}\n\nيمكن تقديم طلب جديد لفترة زمنية أخرى من صفحة حجز المواعيد لدى الممارس.\n\n{2} ليس خدمة طوارئ.\n
booking.mail.followUp.rescheduled.subject=تم تغيير الموعد
booking.mail.followUp.rescheduled.body=مرحبًا،\n\nتم تغيير الموعد مع {0}.\n\n{1}\n\nالفترة الزمنية الجديدة:\n{2}\n\n{3}{4} ليس خدمة طوارئ.\n
booking.mail.followUp.expired.subject=انتهت صلاحية الطلب
booking.mail.followUp.expired.body=مرحبًا،\n\nبقي طلب الموعد مع {0} دون رد وانتهت صلاحيته:\n\n{1}\n\nلم تعد هذه الفترة الزمنية محجوزة. يمكن تقديم طلب جديد من صفحة حجز المواعيد لدى الممارس.\n\n{2} ليس خدمة طوارئ.\n
booking.mail.followUp.modified.subject=تم تعديل الموعد
booking.mail.followUp.modified.body=مرحبًا،\n\nتم تعديل الموعد مع {0}.\n\n{1}\n\nالموعد:\n{2}\n\n{3}{4} ليس خدمة طوارئ.\n
booking.mail.followUp.link=للاطلاع على الموعد أو إلغائه، يُرجى فتح هذا الرابط الشخصي:\n{0}\n\nيحلّ هذا الرابط محلّ روابط الرسائل السابقة، التي لم تعد صالحة. يُرجى عدم مشاركته مع أي شخص.\n\n
