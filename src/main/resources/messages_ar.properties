booking.mail.followUp.confirmed.body=مرحبًا،\n\nتم تأكيد الموعد مع {0}:\n\n{1}\n\nللاطلاع عليه أو إلغائه، يُرجى فتح هذا الرابط الشخصي:\n{2}\n\nيحلّ هذا الرابط محلّ روابط الرسائل السابقة، التي لم تعد صالحة. يُرجى عدم مشاركته مع أي شخص.\n\n{3} ليس خدمة طوارئ.\n
