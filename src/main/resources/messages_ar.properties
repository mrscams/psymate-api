booking.mail.verify.body=مرحبًا،\n\nتم طلب موعد مع {0}:\n\n{1}\n\nلتأكيد البريد الإلكتروني وإرسال الطلب، يُرجى فتح هذا الرابط (مدة الصلاحية بالدقائق: {2}):\n{3}\n\nلا يُحجز أي موعد قبل فتح هذا الرابط. إذا لم يكن هذا الطلب صادرًا عنك، يُرجى تجاهل هذه الرسالة: سيُحذف الطلب خلال 24 ساعة.\n\n{4} ليس خدمة طوارئ.\n
booking.mail.pending.subject=طلب الموعد
booking.mail.pending.body=مرحبًا،\n\nتم تأكيد البريد الإلكتروني، وأُرسل طلب الموعد مع {0}:\n\n{1}\n\nسيصل رد الممارس عبر البريد الإلكتروني. لمتابعة الطلب أو إلغائه، يُرجى فتح هذا الرابط الشخصي:\n{2}\n\nيُرجى الاحتفاظ بهذه الرسالة: هذا الرابط هو الوسيلة الوحيدة لإدارة الطلب. يُرجى عدم مشاركته مع أي شخص.\n\n{3} ليس خدمة طوارئ.\n
booking.mail.confirmed.subject=الموعد
booking.mail.confirmed.body=مرحبًا،\n\nتم تأكيد الموعد مع {0}:\n\n{1}\n\nللاطلاع عليه أو إلغائه، يُرجى فتح هذا الرابط الشخصي:\n{2}\n\nيُرجى الاحتفاظ بهذه الرسالة: هذا الرابط هو الوسيلة الوحيدة لإدارة الموعد. يُرجى عدم مشاركته مع أي شخص.\n\n{3} ليس خدمة طوارئ.\n
booking.mail.newRequest.subject=طلب موعد جديد
booking.mail.newRequest.body=مرحبًا،\n\nطلب موعد عبر الإنترنت بانتظار الرد.\n\nصاحب الطلب: {0}\n{1}\n\nللتأكيد أو الرفض من صفحة المواعيد:\n{2}\n
booking.mail.newAppointment.subject=موعد جديد محجوز عبر الإنترنت
booking.mail.newAppointment.body=مرحبًا،\n\nتم حجز موعد عبر الإنترنت، وهو مؤكَّد في صفحة المواعيد.\n\nصاحب الطلب: {0}\n{1}\n\nصفحة المواعيد:\n{2}\n
