mail.change.body=Hello,\n\nA request was made on {0} to change your sign-in e-mail address: this address would become your login. Click this link to confirm it (valid for {2} hours, single use):\n\n{1}\n\nUntil you confirm, your previous address stays valid. If you did not make this request, ignore this message.\n
mail.changed.subject={0}: your sign-in e-mail address has changed
mail.changed.body=Hello,\n\nThe sign-in e-mail address of your {0} account has just been replaced by {1}. This address can no longer be used to sign in and your other devices have been signed out.\n\nIf you did not make this change, write to support right away at {2}, they can help you secure your account\n
mail.changeExists.subject={0}: you already have an account
mail.changeExists.body=Hello,\n\nA request was just made to use this address as a {0} sign-in address, but an account already exists with it.\nYou can sign in here:\n\n{1}\n\nIf you forgot your password, use "Forgot password" on the sign-in page. If you did not make this request, ignore this message.\n
