mail.exists.body=Bonjour,\n\nUne inscription vient d''être demandée sur {0} avec cette adresse, mais un compte existe déjà.\nVous pouvez vous connecter ici :\n\n{1}\n\nSi vous avez oublié votre mot de passe, utilisez « Mot de passe oublié » sur la page de connexion. Si vous n''êtes pas à l''origine de cette demande, ignorez ce message.\n
