mail.confirm.body=Bonjour,\n\nMerci de vous être inscrit sur {0}. Cliquez sur ce lien pour confirmer votre adresse e-mail (valable {2} heures, usage unique) :\n\n{1}\n\nSi vous n''êtes pas à l''origine de cette inscription, ignorez ce message.\n
