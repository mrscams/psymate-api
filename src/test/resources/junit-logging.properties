# Configuration java.util.logging des JVM de test (argLine du pom), avant que Spring Boot ne prenne
# la main sur la journalisation. Identique a celle du JDK, sauf la graine de l'ordre aleatoire des
# classes (junit-platform.properties), que JUnit journalise au niveau CONFIG.
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=CONFIG
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
.level=INFO
org.junit.jupiter.api.ClassOrderer$Random.level=CONFIG
