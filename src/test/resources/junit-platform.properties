# M9-19 (revue §5 A-19, mesure 4) : classes de test dans un ordre aleatoire, pour qu'une dependance
# cachee a l'ordre (base partagee entre les tests d'une meme JVM) apparaisse tout de suite.
# La graine est journalisee au demarrage de chaque JVM de test (junit-logging.properties) :
#   ClassOrderer.Random default seed: <n>
# Pour rejouer un ordre : -Djunit.jupiter.execution.order.random.seed=<n> sur la ligne Maven.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
